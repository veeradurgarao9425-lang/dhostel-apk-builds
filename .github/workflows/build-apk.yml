name: Build Android APK

on:
  workflow_dispatch:  # Always build when triggered manually from GitHub Actions UI
  push:
    branches: [main, master]
    # NOTE: APK only builds when commit message contains [build] or [apk]
    # Example: "fix: keyboard fix [build]"
    # Plain commits (backend fixes, etc.) will be SKIPPED automatically

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip build unless commit message has [build] or [apk], or it's a manual trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[apk]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force

      - name: Delete old artifacts to free storage quota
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const artifacts = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              for (const artifact of artifacts.data.artifacts) {
                console.log(`Deleting old artifact: ${artifact.id} (${artifact.name})`);
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                } catch (e) {
                  console.warn(`Could not delete artifact ${artifact.id}: ${e.message}`);
                }
              }
              console.log('All old artifacts cleaned up successfully.');
            } catch (err) {
              console.warn('Could not delete old artifacts (non-fatal):', err.message);
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci || npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Patch AndroidManifest to resolve Firebase metadata merge conflicts
        working-directory: mobile
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, "utf8");
              if (!xml.includes("xmlns:tools")) {
                xml = xml.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"");
              }
              xml = xml.replace(/tools:replace="[^"]*"/g, "");
              xml = xml.replace(/android:name="com.google.firebase.messaging.default_notification_color" android:resource="[^"]*"/g, "$& tools:replace=\"android:resource\"");
              xml = xml.replace(/android:name="com.google.firebase.messaging.default_notification_icon" android:resource="[^"]*"/g, "$& tools:replace=\"android:resource\"");
              xml = xml.replace(/android:name="expo.modules.notifications.default_notification_color" android:resource="[^"]*"/g, "$& tools:replace=\"android:resource\"");
              xml = xml.replace(/android:name="expo.modules.notifications.default_notification_icon" android:resource="[^"]*"/g, "$& tools:replace=\"android:resource\"");
              fs.writeFileSync(path, xml);
              console.log("Successfully patched AndroidManifest.xml with tools:replace");
            }
          '

      - name: Grant execute permission to gradlew
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Configure Gradle Memory & Asset Settings
        working-directory: mobile/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.enablePngCrunchInReleaseBuilds=false" >> gradle.properties

      - name: Build Release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: http://143.244.131.69:8081/api
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK artifact (Non-blocking fallback)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dhostel-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          overwrite: true

      - name: Publish APK to GitHub Releases (Bypasses Actions Storage Quota)
        uses: ncipollo/release-action@v1
        with:
          artifacts: "mobile/android/app/build/outputs/apk/release/app-release.apk"
          tag: "v-latest"
          name: "Latest Android APK Release"
          body: "Latest compiled Android release APK for Hostix mobile app."
          allowUpdates: true
          recreateRelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

