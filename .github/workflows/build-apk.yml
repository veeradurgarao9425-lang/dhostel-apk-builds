name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force

      - name: Delete old artifacts to free storage quota
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const artifacts = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              for (const artifact of artifacts.data.artifacts) {
                console.log(`Deleting old artifact: ${artifact.id} (${artifact.name})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
              console.log('All old artifacts cleaned up successfully.');
            } catch (err) {
              console.warn('Could not delete old artifacts (non-fatal):', err.message);
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci || npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Grant execute permission to gradlew
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://dhostel-backend.onrender.com/api
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhostel-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          overwrite: true
